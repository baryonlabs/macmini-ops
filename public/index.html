<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>macmini-ops</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%9B%A0%3C/text%3E%3C/svg%3E" />
<style>
  :root { --bg:#0b0d12; --panel:#151922; --panel-2:#1b2130; --line:#262d3d; --text:#e8ecf6; --muted:#8d97ab; --faint:#5f6a7d;
          --ok:#37d67a; --warn:#f5b544; --crit:#ff5d5d; --accent:#6aa9ff; color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f6f9; --panel:#fff; --panel-2:#fbfcfe; --line:#dde2ec; --text:#18202e; --muted:#5b6577; --faint:#8a93a3;
            --ok:#16a45a; --warn:#b7791f; --crit:#d93a3a; color-scheme: light; }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin:0; color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif; line-height:1.5; }
  header, main { max-width:1180px; margin:0 auto; padding:24px; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:21px; } .sub { color:var(--muted); font-size:12.5px; margin:2px 0 0; }
  .meta { color:var(--faint); font-size:12px; display:flex; gap:12px; flex-wrap:wrap; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px; margin-top:8px; }
  .agent { border:1px solid var(--line); border-radius:16px; padding:16px; background:linear-gradient(160deg,var(--panel-2),var(--panel)); display:flex; flex-direction:column; gap:8px; }
  .agent.crit { border-color: color-mix(in srgb, var(--crit) 55%, transparent); }
  .agent.warn { border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
  .head { display:flex; align-items:center; gap:10px; } .icon { font-size:34px; line-height:1; }
  .name { font-weight:650; font-size:15.5px; } .when { color:var(--faint); font-size:11px; }
  .pill { margin-left:auto; font-size:11px; padding:3px 9px; border-radius:999px; border:1px solid var(--line); white-space:nowrap; }
  .pill.ok { color:var(--ok); border-color:color-mix(in srgb,var(--ok) 45%,transparent); }
  .pill.warn { color:var(--warn); border-color:color-mix(in srgb,var(--warn) 45%,transparent); }
  .pill.crit { color:var(--crit); border-color:color-mix(in srgb,var(--crit) 50%,transparent); }
  .metrics { display:flex; flex-wrap:wrap; gap:6px; } .metric { font-size:11.5px; color:var(--muted); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:2px 8px; }
  .metric b { color:var(--text); font-weight:600; }
  ul.findings { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px; }
  ul.findings li { font-size:12.5px; padding:6px 9px; border-radius:9px; background:var(--bg); border-left:3px solid var(--line); }
  ul.findings li.crit { border-left-color:var(--crit); } ul.findings li.warn { border-left-color:var(--warn); }
  ul.findings small { display:block; color:var(--faint); font-size:11px; word-break:break-all; }
  .okmsg { font-size:12.5px; color:var(--ok); }
  .row { display:flex; gap:8px; align-items:center; margin-top:auto; }
  button { font:inherit; font-size:12px; padding:5px 12px; border-radius:999px; cursor:pointer; color:var(--text); background:var(--panel-2); border:1px solid color-mix(in srgb,var(--accent) 45%,transparent); }
  button:disabled { opacity:.5; cursor:default; }
  a { color:var(--accent); font-size:12px; }
  h2 { font-size:13px; letter-spacing:.08em; color:var(--muted); margin:30px 0 10px; }
  table { width:100%; border-collapse:collapse; font-size:12px; } td { padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  td.t { color:var(--faint); white-space:nowrap; width:1%; } td.k { white-space:nowrap; width:1%; }
  .tablewrap { border:1px solid var(--line); border-radius:12px; overflow:auto; background:var(--panel); }
  @media (max-width:640px) { header, main { padding:16px; } }
</style>
</head>
<body>
<header>
  <div><h1 id="title">🛠️ macmini-ops</h1><p class="sub" id="subtitle"></p></div>
  <div class="meta" id="meta"></div>
</header>
<main>
  <div class="grid" id="agents"></div>
  <h2 id="h-reports"></h2>
  <div id="reports" class="meta"></div>
  <h2 id="h-events"></h2>
  <div class="tablewrap"><table id="events"></table></div>
</main>
<script>
(function () {
  const $ = s => document.querySelector(s);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
    return n;
  };
  const I18N = {
    en: {
      subtitle: 'Always-on checks for servers, apps, portals and websites, with allow-listed self-healing.',
      reports: 'Root-cause reports (LLM)', events: 'Recent events',
      status: { ok: 'OK', warn: 'Warning', crit: 'Critical', pending: 'Pending' }, checking: 'Checking…',
      never: 'not run yet', sec: n => `${n}s ago`, min: n => `${n} min ago`, hour: n => `${n} h ago`, every: sec => sec < 60 ? `every ${sec}s` : `every ${Math.round(sec / 60)} min`,
      webhook: on => `Webhook: ${on ? 'on' : 'off'}`, llm: v => `LLM: ${v || 'off'}`, updated: 'Updated',
      noIssues: '✓ No issues', runNow: 'Run now', lastReport: 'Latest report',
      noReports: 'None yet — when a critical problem persists, the LLM writes a root-cause report.',
      eventType: { open: 'Opened', resolved: 'Recovered', action: 'Auto-fix', diagnose: 'LLM' }, noEvents: 'No events',
      tokenPrompt: 'Ops token (~/.macmini-ops/token on the server)', badToken: 'Wrong token.', loadFail: 'Failed to load',
      dateLocale: 'en-US',
    },
    ko: {
      subtitle: '서버 · 앱 · 포탈 · 사이트를 상시 점검하고, 허용된 범위에서 자동 복구합니다.',
      reports: '원인 분석 보고서 (LLM)', events: '최근 기록',
      status: { ok: '정상', warn: '경고', crit: '심각', pending: '대기' }, checking: '점검 중…',
      never: '아직 실행 전', sec: n => `${n}초 전`, min: n => `${n}분 전`, hour: n => `${n}시간 전`, every: sec => sec < 60 ? `${sec}초마다` : `${Math.round(sec / 60)}분마다`,
      webhook: on => `알림 웹훅: ${on ? '켜짐' : '꺼짐'}`, llm: v => `LLM 분석: ${v || '꺼짐'}`, updated: '갱신',
      noIssues: '✓ 문제 없음', runNow: '지금 점검', lastReport: '최근 분석 보고서',
      noReports: '아직 없음 — 심각한 문제가 이어지면 LLM이 원인을 분석합니다.',
      eventType: { open: '발생', resolved: '복구', action: '자동 조치', diagnose: 'LLM 분석' }, noEvents: '기록 없음',
      tokenPrompt: '운영 토큰 (서버의 ~/.macmini-ops/token)', badToken: '토큰이 맞지 않습니다.', loadFail: '불러오기 실패',
      dateLocale: 'ko-KR',
    },
  };
  let T = I18N.en;
  const ago = iso => {
    if (!iso) return T.never;
    const s = Math.round((Date.now() - Date.parse(iso)) / 1000);
    return s < 60 ? T.sec(s) : s < 3600 ? T.min(Math.round(s / 60)) : T.hour(Math.round(s / 3600));
  };
  const tokenKey = 'ops-token';
  const getToken = () => { try { return sessionStorage.getItem(tokenKey) || ''; } catch { return ''; } };

  async function runNow(id, btn) {
    let t = getToken();
    if (!t) { t = prompt(T.tokenPrompt); if (!t) return; try { sessionStorage.setItem(tokenKey, t.trim()); } catch {} }
    btn.disabled = true; btn.textContent = T.checking;
    try {
      const r = await fetch(`/api/agents/${id}/run`, { method: 'POST', headers: { Authorization: `Bearer ${getToken()}` } });
      if (r.status === 401) { try { sessionStorage.removeItem(tokenKey); } catch {} alert(T.badToken); }
    } finally { await load(); }
  }

  function render(data) {
    T = I18N[data.locale] || I18N.en;
    document.documentElement.lang = data.locale || 'en';
    $('#title').textContent = `🛠️ ${data.title}`;
    document.title = data.title;
    $('#subtitle').textContent = T.subtitle;
    $('#h-reports').textContent = T.reports;
    $('#h-events').textContent = T.events;
    $('#meta').replaceChildren(
      el('span', {}, T.webhook(data.webhook)),
      el('span', {}, T.llm(data.llm)),
      el('span', {}, `${T.updated} ${new Date().toLocaleTimeString(T.dateLocale, { hour12: false })}`));
    $('#agents').replaceChildren(...data.agents.map(a => {
      const status = a.status || 'pending';
      const findings = a.findings || [];
      return el('section', { class: `agent ${status}`, id: a.id },
        el('div', { class: 'head' }, el('span', { class: 'icon' }, a.icon),
          el('div', {}, el('div', { class: 'name' }, a.name), el('div', { class: 'when' }, `${ago(a.lastRun)} · ${T.every(a.intervalSec)}`)),
          el('span', { class: `pill ${status}` }, a.running ? T.checking : T.status[status])),
        el('div', { class: 'metrics' }, Object.entries(a.metrics || {}).map(([k, v]) => el('span', { class: 'metric' }, `${k} `, el('b', {}, v)))),
        findings.length
          ? el('ul', { class: 'findings' }, findings.map(f => el('li', { class: f.severity }, f.title, f.detail ? el('small', {}, f.detail) : null)))
          : (a.lastRun ? el('div', { class: 'okmsg' }, T.noIssues) : null),
        el('div', { class: 'row' },
          el('button', { type: 'button', onclick: e => runNow(a.id, e.target) }, T.runNow),
          a.lastReport ? el('a', { href: `/reports/${encodeURIComponent(a.lastReport)}`, target: '_blank' }, T.lastReport) : null));
    }));
    $('#reports').replaceChildren(...(data.reports.length ? data.reports.map(r => el('a', { href: `/reports/${encodeURIComponent(r)}`, target: '_blank' }, r)) : [el('span', {}, T.noReports)]));
    const name = Object.fromEntries(data.agents.map(a => [a.id, a.name]));
    $('#events').replaceChildren(...(data.events.length ? data.events.map(e => el('tr', {},
      el('td', { class: 't' }, new Date(e.ts).toLocaleString(T.dateLocale, { hour12: false })),
      el('td', { class: 'k' }, name[e.agent] || e.agent),
      el('td', { class: 'k' }, T.eventType[e.type] || e.type),
      el('td', {}, e.title || e.id || e.status || '', e.detail ? ` — ${e.detail}` : '', e.reason ? ` (${e.reason})` : '', e.report ? ` → ${e.report}` : ''))) : [el('tr', {}, el('td', {}, T.noEvents))]));
  }

  async function load() {
    try { render(await (await fetch('/api/agents', { cache: 'no-store' })).json()); }
    catch { $('#meta').textContent = T.loadFail; }
  }
  load(); setInterval(load, 15000);
})();
</script>
</body>
</html>
