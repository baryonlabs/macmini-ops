name: stale
on:
  schedule:
    - cron: '17 3 * * *'
permissions:
  issues: write
  pull-requests: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: 'pinned,security,good first issue,help wanted,roadmap'
          exempt-pr-labels: 'pinned,security'
          stale-issue-message: 'This issue has had no activity for 60 days. It will close in 14 days unless there is new activity. Comment to keep it open.'
          stale-pr-message: 'This PR has had no activity for 60 days. It will close in 14 days unless it is updated.'
